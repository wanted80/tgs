name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-workflow:
    name: Release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require manifest mode and tagged drafts
        run: |
          if grep -Eq '^[[:space:]]*release-type:' .github/workflows/release-please.yml; then
            echo 'release-type bypasses the manifest draft settings; use config-file instead.'
            exit 1
          fi
          jq --exit-status '
            .draft == true and
            .["force-tag-creation"] == true and
            .["include-component-in-tag"] == false and
            .["include-v-in-tag"] == true
          ' release-please-config.json

  quality:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.85"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-08-26)
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - run: cargo build --locked --release
      - if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo package --locked --target-dir "${{ runner.temp }}/tgs-package"
